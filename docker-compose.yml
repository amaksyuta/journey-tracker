# Linux server deployment (Ubuntu 24.04 + Docker). Nginx terminates TLS and
# proxies to the app container. Usage:  cp .env.example .env && docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    volumes:
      - journey-data:/data          # SQLite DB lives here (back it up!)
    restart: unless-stopped
    expose: ["8000"]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports: ["80:80"]                # add "443:443" + certs for HTTPS (see docs)
    volumes:
      - ./deploy/nginx/journey.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  journey-data:
