# Reverse proxy in front of the FastAPI container (this file is included in nginx's http{} block).
# Production: add a 443 server block with Let's Encrypt certs (certbot) and
# redirect port 80 -> 443. Security headers below are a sane baseline.

# Brute-force protection for the login endpoint: 10 attempts/minute per IP.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app:8000;
    }

    location / {
        proxy_pass http://app:8000;
    }
}
